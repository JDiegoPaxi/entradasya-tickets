name: Tickets CI

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build and Generate Artifact
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: npm

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Validar estructura del proyecto
      - name: Validate project structure
        run: |
          test -f package.json
          test -f package-lock.json
          echo "Project structure validated"

      # 5. Comprobar sintaxis JavaScript
      - name: Check JavaScript syntax
        run: |
          find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -name '*.js' -type f -print0 |
          xargs -0 -r -n1 node --check

      # 6. Preparar archivos del artefacto
      - name: Prepare artifact
        run: |
          mkdir -p artifact

          rsync -av \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='artifact' \
            --exclude='*.log' \
            ./ artifact/

      # 7. Generar y publicar artefacto
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tickets-build
          path: artifact/
          if-no-files-found: error
          retention-days: 7
